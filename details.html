<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    {% extends 'base.html' %}
    {% load static %}
    {% block content %}
{% for x in data %}
 <div class="row py-3">
          <p class="fs-3 text-center">Our <b class="text-mycolor2">News</b></p>
                <hr class="w-25 mx-auto"/>
                <div class="col-sm-10 mx-auto shadow-lg p-4">
                  <div class="row py-2">

                    <div class="col-sm-10 mx-auto">
                        <img src="../{{x.picture}}" class="img-fluid imgdetails w-100" >
                        <h4 class="pt-4">{{x.headlines}}</h4>
                        <p class="py-3">{{x.description}}</p>
                        <p><b><i class="fa-solid fa-calendar-days"></i>Updated on </b>{{x.added_date}}</p>
                        category : <span class="badge bg-success">{{x.news_category}}</span>
                        <br/>News From : <span class="badge bg-warning">{{x.city}}</span>
                        <br/><small><span class="text-body-secondary">Uploaded By:Mr. Aryan Maurya</span></small>
                    </div>
                   
     
     

                  </div>
                </div>
 </div>
 {% endfor %}

    {% endblock %}
</body>
</html>
